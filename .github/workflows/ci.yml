name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Node 22 ist keine Vorliebe, sondern die Voraussetzung: `engines.node` sagt
# ">=22 <23", `.nvmrc` sagt 22, und npm wertet beides nicht aus. Bis zum
# 2026-10-01 lief die CI auf 20 — und `rebuild:node` fiel auf dem macOS-Runner
# um, seit Mai, bei jedem Lauf.
env:
  NODE_VERSION: '22'

jobs:
  # Der Lint-Lauf prueft **die geaenderten Dateien**, nicht das Projekt.
  #
  # `npm run lint` ist projektweit rot (830 Probleme, 478 Fehler) und war es
  # vorher schon. Ein Job, der das ausfuehrt, kann nie gruen werden — er hat das
  # CI-Abzeichen im README seit Mai rot gehalten und damit jede echte Regression
  # unsichtbar gemacht. Das dokumentierte Gate des Projekts lautet: *keine neuen
  # Probleme in den geaenderten Dateien*. Genau das steht hier, maschinell.
  lint:
    name: Lint (geaenderte Dateien)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Fuer den Diff gegen den Vorgaenger-Commit bzw. den PR-Basispunkt.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint auf den geaenderten Dateien
        # Die drei Werte kommen ueber die Umgebung herein und nicht per
        # `${{ }}`-Einsetzung in die Zeile: ein Branchname darf Zeichen tragen,
        # die eine Shell als Syntax liest, und bei einem PR aus einem Fork
        # bestimmt den Namen jemand anderes. Siehe die Hinweise zu
        # Workflow-Injection in der GitHub-Doku.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin -- "$BASE_REF"
            base="origin/$BASE_REF"
          else
            base="$BEFORE_SHA"
            # Erster Push auf einen Branch: kein Vorgaenger, dann der Elternteil.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD^"
            fi
          fi
          files=$(git diff --name-only --diff-filter=d "$base" HEAD -- 'src/**/*.ts' 'src/**/*.tsx' || true)
          if [ -z "$files" ]; then
            echo "Keine geaenderten Quelldateien unter src/ — nichts zu pruefen."
            exit 0
          fi
          echo "$files"
          # --max-warnings bleibt ungesetzt: Warnungen sind im Bestand
          # allgegenwaertig, Fehler sind das Gate.
          npx eslint $files

  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Die beiden spezifischen Configs, nicht die Root-Config: die zieht
      # `conserved/` mit und rauscht. Beide sind gruen und sollen es bleiben.
      - run: npx tsc -p tsconfig.main.json --noEmit
      - run: npx tsc -p tsconfig.renderer.json --noEmit

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # tmux ist harte Voraussetzung des Projekts und nicht nur Testbeiwerk:
      # `capture-pane-join.test.ts` prueft eine Behauptung ueber tmux selbst.
      # Die Versionen unterscheiden sich — ubuntu-22.04 liefert 3.2a, macOS ueber
      # Homebrew 3.7c —, und genau daran ist eine zu starke Zusicherung in jenem
      # Test aufgefallen. Die Matrix ist hier der Nutzen, nicht die Last.
      - name: tmux installieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      # **Der macOS-Runner bringt kein tmux mit.** Das war nicht bekannt, weil
      # der Job vorher schon im Schritt davor umfiel; der erste Lauf mit
      # `tmux -V` hat es in einer Zeile gezeigt: `command not found`, Exit 127.
      - name: tmux installieren (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: tmux-Version protokollieren
        run: tmux -V

      # **Python 3.11, und das ist der Kern des macOS-Fehlschlags.** Das Projekt
      # zieht node-gyp 9.4.1 mit, und dessen `gyp` importiert
      # `distutils.version` — aus Python 3.12 ist `distutils` entfernt. Der
      # macOS-Runner bringt 3.12+ mit, der Linux-Runner 3.10; deshalb fiel genau
      # ein Feld der Matrix um, mit `ModuleNotFoundError: No module named
      # 'distutils'`. Hier wird die Version festgenagelt statt node-gyp
      # ausgetauscht: so baut die CI mit demselben node-gyp wie die Entwicklung.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      # **Nicht** `npm run rebuild:node`: das Skript haengt `2>/dev/null` an, und
      # damit war der Fehlschlag auf dem macOS-Runner monatelang eine nackte
      # Exit-1 ohne Grund. Lokal ist das Schweigen gewollt (Rauschen bei jedem
      # Testlauf), in der CI ist es der Unterschied zwischen einem Befund und
      # einem Raetsel — der distutils-Fehler stand im ersten Lauf ohne die
      # Umleitung sofort da.
      - name: better-sqlite3 fuer Node bauen
        working-directory: node_modules/better-sqlite3
        run: npx node-gyp rebuild --release

      - run: npm run test

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
        with:
          # `version:generate` zaehlt Commits seit dem letzten Tag und braucht
          # die Historie.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

  audit:
    name: Security Audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
