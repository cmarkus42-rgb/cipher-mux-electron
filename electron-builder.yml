appId: com.cipher.mux
productName: cipher-mux
directories:
  output: out
  buildResources: assets
files:
  - dist/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  target:
    - dmg
  darkModeSupport: true
  extendInfo:
    NSAppleEventsUsageDescription: "cipher-mux needs Apple Events for tmux integration."
    NSAccessibilityUsageDescription: "cipher-mux needs Accessibility access for BT Shutter remote control (exclusive HID capture)."
dmg:
  icon: assets/icon.icns
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
    - x: 270
      y: 350
      type: file
      path: "assets/Read Me First.txt"
extraResources:
  - from: assets/bin/ab-shutter-bridge
    to: bin/ab-shutter-bridge
  - from: assets/bin/bt-remote-bridge
    to: bin/bt-remote-bridge
  - from: src/main/bluetooth/default-profiles
    to: bt-remote-profiles
  - from: assets/voices
    to: voices
    filter:
      - "**/*"
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/sherpa-onnx-darwin-*/**"
  - "**/dist/main/main/voice/piper-worker.js"
npmRebuild: true
