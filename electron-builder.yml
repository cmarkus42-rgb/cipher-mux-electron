appId: com.cipher.mux
productName: cipher-mux
directories:
  output: out
  buildResources: assets
files:
  - dist/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  target:
    - dmg
  darkModeSupport: true
  extendInfo:
    NSAppleEventsUsageDescription: "cipher-mux needs Apple Events for tmux integration."
    NSAccessibilityUsageDescription: "cipher-mux needs Accessibility access for BT Shutter remote control (exclusive HID capture)."
dmg:
  icon: assets/icon.icns
extraResources:
  - from: assets/bin/ab-shutter-bridge
    to: bin/ab-shutter-bridge
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/sherpa-onnx-darwin-*/**"
  - "**/dist/main/main/voice/piper-worker.js"
npmRebuild: true
