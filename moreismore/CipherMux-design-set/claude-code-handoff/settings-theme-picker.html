<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>cipher-mux · settings · theme picker mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* -- Page chrome (NOT part of the picker; just the preview shell) -- */
  html, body { margin: 0; padding: 0; background: #111; min-height: 100vh;
    font-family: system-ui, sans-serif; color: #ddd; }
  .shell-note { max-width: 780px; margin: 28px auto 10px; padding: 10px 14px;
    background: #1a1a1d; border-left: 3px solid #2d8a4e; font-family: 'Fira Code', monospace;
    font-size: 12px; line-height: 1.6; color: #aaa; }
  .shell-note b { color: #e8e8ec; }

  /* -- The actual Settings window surface -- */
  .window {
    max-width: 780px; margin: 18px auto; background: var(--color-bg);
    border: 1px solid var(--color-border); box-shadow: 0 12px 48px rgba(0,0,0,0.5);
    color: var(--color-text); font-family: system-ui, sans-serif;
  }
  .win-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: var(--color-bg-elevated);
    border-bottom: 1px solid var(--color-border);
    font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; font-size: 12px;
  }
  .win-titlebar .dots { display: flex; gap: 6px; }
  .win-titlebar .dots span { width: 10px; height: 10px; border-radius: 50%;
    background: var(--color-text-dim); opacity: 0.4; }
  .win-tabs {
    display: flex; gap: 2px; padding: 0 12px; background: var(--color-bg-elevated);
    border-bottom: 1px solid var(--color-border);
  }
  .win-tabs button {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    padding: 8px 14px; font-family: 'Fira Code', monospace; font-size: 11px;
    color: var(--color-text-dim); cursor: pointer; text-transform: lowercase;
    letter-spacing: 0.04em;
  }
  .win-tabs button.active {
    color: var(--color-text); border-bottom-color: var(--color-accent);
  }

  .win-body { padding: 18px 20px 24px; }

  /* Section header styles — matches existing settings-section__title convention */
  .settings-section__title {
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--color-text); margin: 0 0 4px;
  }
  .settings-section__hint {
    font-family: 'Fira Code', monospace; font-size: 11px; color: var(--color-text-dim);
    margin: 0 0 14px; line-height: 1.6;
  }

  /* =================== THE THEME PICKER =================== */
  .theme-picker {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 1px solid var(--color-border);
    background: var(--color-bg-sunken);
  }
  .theme-row {
    display: grid;
    grid-template-columns: 20px auto 1fr auto;
    align-items: center; gap: 10px;
    padding: 8px 12px;
    border-left: 3px solid transparent;
    background: var(--color-bg-elevated);
    cursor: pointer; user-select: none;
    transition: background 120ms ease, border-color 120ms ease;
    border-top: 1px solid var(--color-border);
  }
  /* Remove top border on first row of each column */
  .theme-row:nth-child(1), .theme-row:nth-child(2) { border-top: none; }
  /* Subtle divider between the two columns */
  .theme-row:nth-child(odd) { border-right: 1px solid var(--color-border); }
  .theme-row:hover { background: var(--color-bg); }
  .theme-row[aria-checked="true"] {
    border-left-color: var(--color-accent);
    background: var(--color-accent-soft);
  }

  /* Radio-dot */
  .theme-radio {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid var(--color-border); background: transparent;
    display: grid; place-items: center;
  }
  .theme-row[aria-checked="true"] .theme-radio {
    border-color: var(--color-accent);
  }
  .theme-row[aria-checked="true"] .theme-radio::after {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--color-accent);
  }

  .theme-meta { display: flex; flex-direction: column; min-width: 0; }
  .theme-name {
    font-family: 'Rajdhani', sans-serif; font-weight: 700;
    font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--color-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .theme-tag {
    font-family: 'Fira Code', monospace; font-size: 9px; color: var(--color-text-dim);
    margin-top: 1px; letter-spacing: 0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Farbschema-Streifen: 8 swatches, kompakter */
  .theme-strip { display: flex; height: 22px; border: 1px solid var(--color-border); flex-shrink: 0; }
  .theme-strip span { width: 10px; height: 100%; display: block; }

  .theme-mode {
    font-family: 'Fira Code', monospace; font-size: 9px;
    color: var(--color-text-dim); letter-spacing: 0.06em; text-transform: uppercase;
    text-align: right; flex-shrink: 0;
  }
  .theme-row[aria-checked="true"] .theme-mode {
    color: var(--color-accent);
  }

  /* Status bar at the bottom of the window for context */
  .win-statusbar {
    display: flex; align-items: center; gap: 20px;
    padding: 6px 14px; border-top: 1px solid var(--color-border);
    background: var(--color-bg-elevated);
    font-family: 'Fira Code', monospace; font-size: 10px;
    color: var(--color-text-dim); letter-spacing: 0.04em;
  }
  .win-statusbar .current-theme { color: var(--color-text); }
  .win-statusbar .current-theme b { color: var(--color-accent); }
</style>
</head>
<body>

<div class="shell-note">
  <b>mockup · theme picker in settings</b><br>
  exakt so soll die liste aussehen, die claude code in <code>InfoSettingsView.tsx</code> einbaut.
  klick eine zeile an — der theme wechselt live (nur dieses mockup; in der app ruft es <code>setTheme(id)</code>).
  farbschema-streifen = 8 swatches aus <code>themes.json → previewSwatches[]</code>.
</div>

<div id="app"></div>

<script>
  // ======== Die 10 Themes — spiegelt themes.json ========
  const THEMES = [
    { id:'cipher-ivory',   name:'Cipher Ivory',   tag:'Default · Light · Ceramic',            mode:'light',
      previewSwatches:['#F2F2E8','#FFFFF0','#3A3F47','#1A1A1D','#2d8a4e','#00CC40','#E05500','#DD0035'] },
    { id:'cipher-dark',    name:'Cipher Dark',    tag:'Default · Dark · Muted neon',          mode:'dark',
      previewSwatches:['#2A2A32','#33333C','#3E3E4A','#D8D8E0','#5C9A6E','#5C9A6E','#C07840','#B85060'] },
    { id:'blueprint',      name:'Blueprint',      tag:'Drafting · Cyan on indigo',            mode:'dark',
      previewSwatches:['#0E2A44','#143657','#2E6FA0','#DCEEFF','#7FD3FF','#8EE3B0','#FFC170','#FF8FA0'] },
    { id:'warm-paper',     name:'Warm Paper',     tag:'Minimal · Sepia · Readable',           mode:'light',
      previewSwatches:['#F7F2E8','#FFFBF0','#C4B89A','#3A2E1A','#8B4513','#556B2F','#B8590F','#A0302A'] },
    { id:'gruvbox-dark',   name:'Gruvbox Dark',   tag:'Coder classic · Warm retro',           mode:'dark',
      previewSwatches:['#282828','#32302F','#504945','#EBDBB2','#FABD2F','#B8BB26','#FE8019','#FB4934'] },
    { id:'nord',           name:'Nord',           tag:'Coder classic · Cool frost',           mode:'dark',
      previewSwatches:['#2E3440','#3B4252','#434C5E','#ECEFF4','#88C0D0','#A3BE8C','#EBCB8B','#BF616A'] },
    { id:'synthwave',      name:'Synthwave',      tag:'80s Sunset · Magenta + violet',        mode:'dark',
      previewSwatches:['#1A0B2E','#241040','#4A1E6E','#F8E6FF','#FF2EAA','#50FFC0','#FFC040','#FF4080'] },
    { id:'matrix',         name:'Matrix',         tag:'Follow the white rabbit · Phosphor',   mode:'dark',
      previewSwatches:['#000000','#030805','#0A5030','#00FF41','#00FF41','#00FF41','#E0C020','#FF3030'] },
    { id:'brutalist',      name:'Brutalist',      tag:'Schwarz/Weiß + Signalfarbe',           mode:'light',
      previewSwatches:['#FFFFFF','#FFFFFF','#000000','#000000','#FF3300','#008800','#FF6600','#FF3300'] },
    { id:'high-contrast',  name:'High Contrast',  tag:'Accessibility-first · WCAG AAA',       mode:'dark',
      previewSwatches:['#000000','#0A0A0A','#FFFFFF','#FFFFFF','#FFFF00','#00FF00','#FFAA00','#FF5555'] },
  ];

  // All tokens, inline — so this mockup works without the full CSS files.
  // In the real app, these live in src/renderer/styles/theme-*.css.
  const THEME_TOKENS = {
    'cipher-ivory':  { '--color-bg':'#F2F2E8','--color-bg-elevated':'#FFFFF0','--color-bg-sunken':'#E8E8DE','--color-border':'#3A3F47','--color-text':'#1A1A1D','--color-text-dim':'#6A6A72','--color-accent':'#2d8a4e','--color-accent-soft':'rgba(45,138,78,0.10)' },
    'cipher-dark':   { '--color-bg':'#2A2A32','--color-bg-elevated':'#33333C','--color-bg-sunken':'#222228','--color-border':'#3E3E4A','--color-text':'#D8D8E0','--color-text-dim':'#6E6E80','--color-accent':'#5C9A6E','--color-accent-soft':'rgba(92,154,110,0.10)' },
    'blueprint':     { '--color-bg':'#0E2A44','--color-bg-elevated':'#143657','--color-bg-sunken':'#081C30','--color-border':'#2E6FA0','--color-text':'#DCEEFF','--color-text-dim':'#6A8FB4','--color-accent':'#7FD3FF','--color-accent-soft':'rgba(127,211,255,0.12)' },
    'warm-paper':    { '--color-bg':'#F7F2E8','--color-bg-elevated':'#FFFBF0','--color-bg-sunken':'#EDE6D4','--color-border':'#C4B89A','--color-text':'#3A2E1A','--color-text-dim':'#8A7A5E','--color-accent':'#8B4513','--color-accent-soft':'rgba(139,69,19,0.08)' },
    'gruvbox-dark':  { '--color-bg':'#282828','--color-bg-elevated':'#32302F','--color-bg-sunken':'#1D2021','--color-border':'#504945','--color-text':'#EBDBB2','--color-text-dim':'#928374','--color-accent':'#FABD2F','--color-accent-soft':'rgba(250,189,47,0.10)' },
    'nord':          { '--color-bg':'#2E3440','--color-bg-elevated':'#3B4252','--color-bg-sunken':'#242933','--color-border':'#434C5E','--color-text':'#ECEFF4','--color-text-dim':'#7B8394','--color-accent':'#88C0D0','--color-accent-soft':'rgba(136,192,208,0.12)' },
    'synthwave':     { '--color-bg':'#1A0B2E','--color-bg-elevated':'#241040','--color-bg-sunken':'#0E0520','--color-border':'#4A1E6E','--color-text':'#F8E6FF','--color-text-dim':'#8A6BB0','--color-accent':'#FF2EAA','--color-accent-soft':'rgba(255,46,170,0.14)' },
    'matrix':        { '--color-bg':'#000000','--color-bg-elevated':'#030805','--color-bg-sunken':'#000000','--color-border':'#0A5030','--color-text':'#00FF41','--color-text-dim':'#008820','--color-accent':'#00FF41','--color-accent-soft':'rgba(0,255,65,0.10)' },
    'brutalist':     { '--color-bg':'#FFFFFF','--color-bg-elevated':'#FFFFFF','--color-bg-sunken':'#F0F0F0','--color-border':'#000000','--color-text':'#000000','--color-text-dim':'#707070','--color-accent':'#FF3300','--color-accent-soft':'rgba(255,51,0,0.12)' },
    'high-contrast': { '--color-bg':'#000000','--color-bg-elevated':'#0A0A0A','--color-bg-sunken':'#000000','--color-border':'#FFFFFF','--color-text':'#FFFFFF','--color-text-dim':'#B0B0B0','--color-accent':'#FFFF00','--color-accent-soft':'rgba(255,255,0,0.12)' },
  };

  let current = 'cipher-dark';

  function applyTheme(id) {
    const t = THEME_TOKENS[id]; if (!t) return;
    for (const [k,v] of Object.entries(t)) document.documentElement.style.setProperty(k,v);
    document.body.dataset.theme = id;
  }

  function render() {
    const theme = THEMES.find(t => t.id === current);
    document.getElementById('app').innerHTML = `
      <div class="window">
        <div class="win-titlebar">
          <div class="dots"><span></span><span></span><span></span></div>
          <div>cipher-mux · einstellungen</div>
          <div style="width:42px"></div>
        </div>
        <div class="win-tabs">
          <button>shortcuts</button>
          <button>features</button>
          <button class="active">settings</button>
        </div>
        <div class="win-body">
          <div class="settings-section__title">theme</div>
          <div class="settings-section__hint">
            wähle ein farbschema. die app und alle terminals übernehmen sofort.
            10 themes, von keramik-hell bis matrix-grün.
          </div>

          <div class="theme-picker" role="radiogroup" aria-label="theme">
            ${THEMES.map(t => `
              <div class="theme-row" role="radio"
                   aria-checked="${t.id === current}"
                   tabindex="0"
                   data-id="${t.id}">
                <div class="theme-radio"></div>
                <div class="theme-strip" aria-hidden="true">
                  ${t.previewSwatches.map(c => `<span style="background:${c}"></span>`).join('')}
                </div>
                <div class="theme-meta">
                  <div class="theme-name">${t.name}</div>
                  <div class="theme-tag">${t.tag}</div>
                </div>
                <div class="theme-mode">${t.mode}</div>
              </div>
            `).join('')}
          </div>

          <div style="margin-top:22px" class="settings-section__title">scan-pfade</div>
          <div class="settings-section__hint">
            verzeichnisse, die beim scan nach claude-code-projekten durchsucht werden. (gekürzt für mockup.)
          </div>
        </div>
        <div class="win-statusbar">
          <span>● orchestrator · idle</span>
          <span>sessions: 4/4</span>
          <span class="current-theme">theme: <b>${theme.name}</b> (${theme.mode})</span>
        </div>
      </div>
    `;
    document.querySelectorAll('.theme-row').forEach(row => {
      row.addEventListener('click', () => {
        current = row.dataset.id;
        applyTheme(current);
        render();
      });
      row.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); row.click(); }
      });
    });
  }

  applyTheme(current);
  render();
</script>

</body>
</html>
