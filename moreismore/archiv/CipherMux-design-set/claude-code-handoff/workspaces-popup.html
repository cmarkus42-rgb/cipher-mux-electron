<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>cipher-mux · Workspaces Popup (bottom-left)</title>
<link rel="stylesheet" href="workspaces.css">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="personas.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #1A1A1D; min-height: 100vh; font-family: var(--font-body); }
  .stage { padding: 40px; display: grid; place-items: start center; min-height: 100vh; }
  .note { color: #8A8A82; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; margin-bottom: 16px; max-width: 720px; }
  .note b { color: var(--color-accent); }

  .appmock { position: relative; width: 900px; height: 520px; background: var(--color-bg); border: 1px solid #000; overflow: hidden; font-family: var(--font-body); }
  .app-stripe {
    position: absolute; inset: 0 0 34px 0;
    background:
      repeating-linear-gradient(0deg, var(--color-bg) 0 23px, var(--color-bg-sunken) 23px 24px),
      var(--color-bg);
    padding: 16px;
    color: var(--color-text-dim);
    font-family: var(--font-mono); font-size: 11px;
    opacity: 0.6;
  }
  .app-stripe::before {
    content: 'session.grid // 3 cols × 2 rows // orchestrator-boots-relay'; display: block;
    color: var(--color-text); font-weight: 700; letter-spacing: 0.05em; margin-bottom: 8px;
  }
  .appbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 34px;
    background: var(--color-bg-elevated);
    border-top: 1px solid var(--color-border-strong);
    display: flex; align-items: center; padding: 0 12px; gap: 18px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
    color: var(--color-text-dim); z-index: 2;
  }
  .appbar .bar-link {
    text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
    color: var(--color-text); font-weight: 700;
    border-bottom: 2px solid transparent; padding: 4px 0; user-select: none;
  }
  .appbar .bar-link[data-active="true"] { border-bottom-color: var(--color-accent); color: var(--color-accent); }
  .appbar .bar-link:hover { color: var(--color-accent); }
  .appbar .bar-spacer { flex: 1; }
  .bar-link.has-pop::after { content: ' ▴'; color: var(--color-text-dim); font-size: 9px; }

  .workspaces-popup {
    position: absolute; left: 8px; bottom: 40px; width: 360px;
    background: var(--color-bg-elevated);
    border: 1px solid var(--color-border-strong);
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    z-index: 10; font-family: var(--font-body);
  }
  .wp-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--color-border); background: var(--color-bg-sunken); }
  .wp-title { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text); }
  .wp-title::before { content: '▸ '; color: var(--color-accent); }
  .wp-head-actions button {
    background: transparent; border: 1px solid transparent; color: var(--color-text-dim);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; cursor: pointer;
  }
  .wp-head-actions button:hover { color: var(--color-accent); border-color: var(--color-border); }

  .wp-list { max-height: 360px; overflow-y: auto; }
  .wp-row {
    display: grid; grid-template-columns: 64px 1fr auto;
    gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--color-border);
    cursor: pointer; align-items: center;
    border-left: 3px solid transparent; transition: background 120ms ease;
  }
  .wp-row:hover { background: var(--color-bg-sunken); }
  .wp-row[aria-current="true"] { background: var(--color-accent-soft); border-left-color: var(--color-accent); }
  .wp-row:last-child { border-bottom: none; }

  /* Mini-grid thumbnail — now uses persona colors */
  .wp-thumb {
    width: 64px; aspect-ratio: 3/2;
    display: grid;
    gap: 2px; background: var(--color-text); padding: 2px;
  }
  .wp-thumb .vcell { padding: 0; font-size: 0; }

  .wp-meta { min-width: 0; }
  .wp-name { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wp-sub { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wp-badge { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-dim); background: var(--color-bg); border: 1px solid var(--color-border); padding: 2px 6px; }

  /* Persona legend row — shows which personas are in the highlighted workspace */
  .wp-legend {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px;
    border-top: 1px solid var(--color-border);
    background: var(--color-bg);
    font-family: var(--font-mono); font-size: 9px;
    letter-spacing: 0.04em;
    color: var(--color-text-dim);
  }
  .wp-legend-item { display: inline-flex; align-items: center; gap: 4px; }
  .wp-legend-item .dot { width: 8px; height: 8px; }
  .wp-legend-item .count { opacity: 0.6; }
  .wp-legend-label {
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-text-dim); margin-right: 4px;
    font-weight: 700;
  }

  .wp-foot { display: flex; gap: 4px; padding: 8px 12px; border-top: 1px solid var(--color-border); background: var(--color-bg-sunken); }
  .wp-foot button {
    flex: 1; background: transparent; border: 1px solid var(--color-border); color: var(--color-text);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 6px 10px; cursor: pointer;
  }
  .wp-foot button:hover { background: var(--color-text); color: var(--color-bg); border-color: var(--color-text); }
  .wp-foot button.ghost { color: var(--color-text-dim); }
  .wp-foot button.ghost:hover { color: var(--color-accent); background: var(--color-bg); border-color: var(--color-accent); }
</style>
</head>
<body>

<div class="stage">
  <div class="note">
    Klick auf <b>workspaces ▴</b> unten links → Popup öffnet sich.
    Thumbnails + Legende nutzen die <b>Persona-Farben</b> aus dem Personas-Tab.
    „edit…" öffnet <code>settings-workspaces.html</code>, „personas…" öffnet <code>settings-personas.html</code>.
  </div>

  <div class="appmock">
    <div class="app-stripe"></div>

    <div class="workspaces-popup" role="dialog" aria-label="Workspaces">
      <div class="wp-head">
        <div class="wp-title">Workspaces</div>
        <div class="wp-head-actions">
          <button title="Save current grid as new workspace">+ new</button>
        </div>
      </div>
      <div class="wp-list" id="wpList"></div>
      <div class="wp-legend" id="wpLegend"></div>
      <div class="wp-foot">
        <button class="ghost" onclick="window.location.href='settings-personas.html'">personas…</button>
        <button class="ghost" onclick="window.location.href='settings-workspaces.html'">edit…</button>
        <button onclick="applySelection()">load</button>
      </div>
    </div>

    <div class="appbar">
      <span class="bar-link">sessions</span>
      <span class="bar-link">orchestrator</span>
      <span class="bar-link has-pop" data-active="true">workspaces</span>
      <span class="bar-link">mpo</span>
      <span class="bar-spacer"></span>
      <span>silent-cipher-echoes · 3×2</span>
    </div>
  </div>
</div>

<script>
  const WORKSPACES = CM.getWorkspaces();
  const PERSONAS = CM.getPersonas();
  let selected = WORKSPACES[0].id;

  function getPersona(id) { return PERSONAS.find(p => p.id === id) || CM.getPersonaById(id); }

  function spanOf(ws, col, row) {
    if (row > 0 && ws.merges && ws.merges[`${col}:${row-1}`]) return 0;
    let span = 1, r = row;
    while (ws.merges && ws.merges[`${col}:${r}`] && r + 1 < ws.rows) { span++; r++; }
    return span;
  }

  function cellBg(personaId) {
    if (personaId === 'empty') return 'repeating-linear-gradient(45deg, var(--color-bg-elevated) 0 2px, var(--color-bg-sunken) 2px 4px)';
    const p = getPersona(personaId);
    return p ? p.color : 'var(--color-text-dim)';
  }

  function renderList() {
    const list = document.getElementById('wpList');
    list.innerHTML = WORKSPACES.map(ws => {
      let cellsHTML = '';
      for (let row = 0; row < ws.rows; row++) {
        for (let col = 0; col < ws.cols; col++) {
          const idx = row * ws.cols + col;
          const span = spanOf(ws, col, row);
          if (span === 0) continue;
          const cell = ws.cells[idx] || { persona: 'empty' };
          const spanAttr = span > 1 ? `grid-row: ${row+1} / span ${span};` : `grid-row: ${row+1};`;
          cellsHTML += `<div class="vcell" style="grid-column: ${col+1}; ${spanAttr} background:${cellBg(cell.persona)};"></div>`;
        }
      }
      const slots = ws.cells.filter(c => c.persona !== 'empty').length;
      const mainPersonas = [...new Set(ws.cells.map(c => c.persona).filter(p => p !== 'empty'))].slice(0, 3);
      const personaNames = mainPersonas.map(pid => getPersona(pid).name.toLowerCase()).join(' · ');
      return `
        <div class="wp-row" data-id="${ws.id}" aria-current="${ws.id === selected}"
             onclick="selectWs('${ws.id}')" ondblclick="applySelection()">
          <div class="wp-thumb" style="grid-template-columns: repeat(${ws.cols}, 1fr); grid-template-rows: repeat(${ws.rows}, 1fr);">
            ${cellsHTML}
          </div>
          <div class="wp-meta">
            <div class="wp-name">${ws.name}</div>
            <div class="wp-sub">${ws.cols}×${ws.rows} · ${slots} slots · ${personaNames}</div>
          </div>
          ${ws.id === WORKSPACES[0].id ? '<div class="wp-badge">DEFAULT</div>' : '<div></div>'}
        </div>
      `;
    }).join('');
  }

  function renderLegend() {
    const ws = WORKSPACES.find(w => w.id === selected);
    if (!ws) return;
    const counts = {};
    for (const c of ws.cells) {
      if (c.persona === 'empty') continue;
      counts[c.persona] = (counts[c.persona] || 0) + 1;
    }
    const items = Object.entries(counts).map(([pid, n]) => {
      const p = getPersona(pid);
      return `<span class="wp-legend-item"><span class="dot" style="background:${p.color}"></span>${p.name.toLowerCase()} <span class="count">×${n}</span></span>`;
    }).join('');
    document.getElementById('wpLegend').innerHTML =
      `<span class="wp-legend-label">Personas</span>${items || '<span>—</span>'}`;
  }

  function selectWs(id) { selected = id; renderList(); renderLegend(); }
  function applySelection() {
    const ws = WORKSPACES.find(w => w.id === selected);
    alert(`→ load workspace "${ws.name}"\n   (cipher-mux would apply this grid + persona assignments)`);
  }

  renderList();
  renderLegend();
</script>

</body>
</html>
